  <text class="faint mono" x="1036" y="426" font-size="10">👁 6</text>
  <text class="faint" x="1068" y="427" font-size="15">+</text>
  <text class="muted" x="420" y="444" font-size="12" font-style="italic">Indexing a 40k-chunk repo stalled /search for ~9s — batch the embed step.</text>

  <!-- Card 3: collapsed DECISION -->
  <rect class="surf" x="344" y="460" width="740" height="50" rx="10"/>
  <rect x="344" y="460" width="740" height="50" rx="10" fill="none" class="strong" stroke-width="1.5"/>
  <rect x="360" y="470" width="78" height="18" rx="9" fill="rgba(155,89,182,0.12)"/>
  <rect x="360" y="470" width="78" height="18" rx="9" fill="none" stroke="#9b59b6" stroke-width="1"/>
  <text class="bpill" x="399" y="483" fill="#9b59b6" text-anchor="middle">DECISION</text>
  <text class="ink" x="450" y="484" font-size="13" font-weight="700">Pin SurrealDB to a fixed git rev across all workspace crates</text>
  <text class="faint mono" x="980" y="484" font-size="10">● 0.88</text>
  <text class="faint mono" x="1036" y="484" font-size="10">👁 11</text>
  <text class="faint" x="1068" y="485" font-size="15">+</text>
