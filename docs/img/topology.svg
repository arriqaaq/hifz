<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .col-label { font-size: 11px; font-weight: 700; fill: #71717a; letter-spacing: 0.08em; text-transform: uppercase; }
      .client { fill: #ffffff; stroke: #52525b; stroke-width: 1.4; }
      .client-name { font-size: 13px; font-weight: 600; fill: #18181b; }
      .client-sub { font-size: 11px; fill: #71717a; }
      .adapter { fill: #ffffff; stroke: #f97316; stroke-width: 1.4; }
      .adapter-name { font-size: 13px; font-weight: 600; fill: #9a3412; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .adapter-sub { font-size: 11px; fill: #b45309; }
      .server { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.6; }
      .server-title { font-size: 14px; font-weight: 700; fill: #4c1d95; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .server-sub { font-size: 12px; fill: #6d28d9; }
      .module { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1; }
      .module-name { font-size: 12px; font-weight: 600; fill: #5b21b6; }
      .ext { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .ext-name { font-size: 12px; font-weight: 600; fill: #166534; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ext-sub { font-size: 11px; fill: #16a34a; }
      .arrow-http { stroke: #2563eb; stroke-width: 1.5; fill: none; }
      .arrow-stdio { stroke: #f59e0b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .arrow-internal { stroke: #8b5cf6; stroke-width: 1.4; fill: none; }
      .arrow-label { font-size: 10px; font-weight: 600; }
      .badge-bg { fill: #ede9fe; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #5b21b6; letter-spacing: 0.04em; text-transform: uppercase; }
    </style>
    <marker id="arr-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-stdio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-internal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Column labels -->
  <text class="col-label" x="40" y="32">Clients</text>
  <text class="col-label" x="290" y="32">Adapters</text>
  <text class="col-label" x="540" y="32">Server</text>

  <!-- Clients column -->
  <g>
    <rect class="client" x="40" y="48" width="190" height="56" rx="8"/>
    <text class="client-name" x="56" y="72">Claude Code</text>
    <text class="client-sub" x="56" y="90">MCP host + hooks runtime</text>
  </g>
  <g>
    <rect class="client" x="40" y="120" width="190" height="56" rx="8"/>
    <text class="client-name" x="56" y="144">HTTP client / agent</text>
    <text class="client-sub" x="56" y="162">any language, any runtime</text>
  </g>
  <g>
    <rect class="client" x="40" y="192" width="190" height="56" rx="8"/>
    <text class="client-name" x="56" y="216">Browser</text>
    <text class="client-sub" x="56" y="234">opens dashboard SPA</text>
  </g>

  <!-- Adapter column -->
  <g>
    <rect class="adapter" x="288" y="48" width="194" height="56" rx="8"/>
    <text class="adapter-name" x="304" y="72">hifz mcp proxy</text>
    <text class="adapter-sub" x="304" y="90">stdio → HTTP bridge</text>
  </g>
  <g>
    <rect class="adapter" x="288" y="120" width="194" height="56" rx="8"/>
    <text class="adapter-name" x="304" y="144">adapter scripts</text>
    <text class="adapter-sub" x="304" y="162">hooks → /observe</text>
  </g>

  <!-- Server box -->
  <g>
    <rect class="server" x="540" y="48" width="300" height="200" rx="12"/>
    <rect class="badge-bg" x="730" y="36" width="100" height="22" rx="11"/>
    <text class="badge-text" x="780" y="51" text-anchor="middle">one process</text>
    <text class="server-title" x="556" y="76">hifz serve</text>
    <text class="server-sub" x="556" y="94">Axum, port 3111</text>

    <rect class="module" x="556" y="110" width="268" height="34" rx="6"/>
    <text class="module-name" x="690" y="132" text-anchor="middle">REST API · /api/v1/*</text>

    <rect class="module" x="556" y="152" width="130" height="34" rx="6"/>
    <text class="module-name" x="621" y="174" text-anchor="middle">MCP handler</text>

    <rect class="module" x="694" y="152" width="130" height="34" rx="6"/>
    <text class="module-name" x="759" y="174" text-anchor="middle">Static dashboard</text>

    <rect class="module" x="556" y="194" width="268" height="34" rx="6"/>
    <text class="module-name" x="690" y="216" text-anchor="middle">search · link · evolve · consolidate · forget</text>
  </g>

  <!-- External -->
  <g>
    <rect class="ext" x="540" y="282" width="146" height="68" rx="8"/>
    <text class="ext-name" x="613" y="312" text-anchor="middle">SurrealDB</text>
    <text class="ext-sub" x="613" y="330" text-anchor="middle">embedded · SurrealKV</text>
  </g>
  <g>
    <rect class="ext" x="694" y="282" width="146" height="68" rx="8"/>
    <text class="ext-name" x="767" y="312" text-anchor="middle">fastembed</text>
    <text class="ext-sub" x="767" y="330" text-anchor="middle">ONNX · 384d local</text>
  </g>

  <!-- Arrows: clients → adapters -->
  <path class="arrow-stdio" d="M 230 76 L 288 76" marker-end="url(#arr-stdio)"/>
  <text class="arrow-label" x="259" y="68" text-anchor="middle" fill="#b45309">stdio</text>

  <path class="arrow-http" d="M 230 148 L 288 148" marker-end="url(#arr-http)"/>
  <text class="arrow-label" x="259" y="140" text-anchor="middle" fill="#1e40af">hooks</text>

  <!-- Browser bypasses adapter, goes direct to server -->
  <path class="arrow-http" d="M 230 220 C 380 220, 470 160, 540 150" marker-end="url(#arr-http)"/>
  <text class="arrow-label" x="380" y="200" text-anchor="middle" fill="#1e40af">HTTP · GET /</text>

  <!-- Adapters → server -->
  <path class="arrow-http" d="M 482 76 L 540 100" marker-end="url(#arr-http)"/>
  <text class="arrow-label" x="500" y="80" fill="#1e40af">HTTP</text>

  <path class="arrow-http" d="M 482 148 L 540 148" marker-end="url(#arr-http)"/>
  <text class="arrow-label" x="500" y="140" fill="#1e40af">POST /observe</text>

  <!-- Server → externals -->
  <path class="arrow-internal" d="M 613 248 L 613 282" marker-end="url(#arr-internal)"/>
  <path class="arrow-internal" d="M 767 248 L 767 282" marker-end="url(#arr-internal)"/>

  <!-- Legend -->
  <g transform="translate(40, 332)">
    <line x1="0" y1="6" x2="30" y2="6" class="arrow-http"/>
    <text font-size="11" fill="#1e40af" font-weight="600" x="38" y="10">HTTP</text>
    <line x1="90" y1="6" x2="120" y2="6" class="arrow-stdio"/>
    <text font-size="11" fill="#b45309" font-weight="600" x="128" y="10">stdio</text>
    <line x1="170" y1="6" x2="200" y2="6" class="arrow-internal"/>
    <text font-size="11" fill="#5b21b6" font-weight="600" x="208" y="10">in-process</text>
  </g>
</svg>
