[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
kernel = { path = "../kernel", features = ["code-parse"] }

surrealdb = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Graph + clustering (E9)
petgraph = "0.6"

# PDF ingest (E6) — pure-Rust, no system deps
pdf-extract = "0.7"

# CLI (E10)
clap = { version = "4", features = ["derive", "env"] }

# REST router (E10) — same axum as hifz
axum = { version = "0.8", features = ["macros"] }

# tree-sitter (code-graph projection reuses kernel's parser)
tree-sitter = "0.26"

[dev-dependencies]
tempfile = "3"
