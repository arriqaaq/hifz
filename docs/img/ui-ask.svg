  <text class="muted" x="352" y="430" font-size="11" letter-spacing="0.04em">RELATED</text>
  <rect class="alt" x="352" y="440" width="208" height="26" rx="13"/><rect x="352" y="440" width="208" height="26" rx="13" fill="none" class="strong" stroke-width="1"/>
  <text class="sec" x="366" y="457" font-size="12">Tell me more about src/search.rs</text>
  <rect class="alt" x="352" y="474" width="150" height="26" rx="13"/><rect x="352" y="474" width="150" height="26" rx="13" fill="none" class="strong" stroke-width="1"/>
  <text class="sec" x="366" y="491" font-size="12">What is RRF fusion?</text>

  <!-- RIGHT aside: Sources -->
  <text class="muted h11" x="728" y="208">Sources</text>
  <rect class="surf" x="1010" y="194" width="78" height="22" rx="6"/><rect x="1010" y="194" width="78" height="22" rx="6" fill="none" class="strong" stroke-width="1.5"/>
  <text class="ink" x="1049" y="209" text-anchor="middle" font-size="11" font-weight="600">New chat</text>

  <!-- source card 1 -->
  <rect class="ink" x="730" y="226" width="360" height="96" rx="10"/>
  <rect class="surf" x="728" y="224" width="360" height="96" rx="10"/><rect x="728" y="224" width="360" height="96" rx="10" fill="none" class="strong" stroke-width="1"/>
  <rect x="744" y="238" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="752" y="250" text-anchor="middle" font-size="11" font-weight="600">1</text>
  <path class="ic" d="M770 240 l5 -5 5 5 -5 5 z"/>
  <text class="dtype" x="786" y="250">CODE</text>
  <text class="mono" x="828" y="250" fill="#1a1a1a" font-size="12">src/search.rs:1-120</text>
  <text class="sec" x="744" y="272" font-size="12.5">RRF merges BM25 and vector hits by</text>
  <text class="sec" x="744" y="289" font-size="12.5">rank; no score normalization needed.</text>
  <rect class="alt" x="744" y="298" width="78" height="16" rx="8"/><text class="mono" x="783" y="310" text-anchor="middle" font-size="9.5" fill="#6a6a63">lines 12-48</text>
  <rect class="alt" x="828" y="298" width="78" height="16" rx="8"/><text class="mono" x="867" y="310" text-anchor="middle" font-size="9.5" fill="#6a6a63">lines 60-91</text>

  <!-- source card 2 -->
  <rect class="ink" x="730" y="334" width="360" height="84" rx="10"/>
  <rect class="surf" x="728" y="332" width="360" height="84" rx="10"/><rect x="728" y="332" width="360" height="84" rx="10" fill="none" class="strong" stroke-width="1"/>
  <rect x="744" y="346" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="752" y="358" text-anchor="middle" font-size="11" font-weight="600">2</text>
  <path class="ic" d="M770 346 h8 l3 3 v9 h-11 z"/>
  <text class="dtype" x="788" y="358">DOC</text>
  <text class="mono" x="822" y="358" fill="#1a1a1a" font-size="11.5">docs/architecture/memory.md</text>
  <text class="sec" x="744" y="382" font-size="12.5">Graph expansion: a neighbor's score =</text>
  <text class="sec" x="744" y="399" font-size="12.5">seed × 0.5 × edge_score (1-hop).</text>

  <!-- source card 3 -->
  <rect class="ink" x="730" y="430" width="360" height="70" rx="10"/>
  <rect class="surf" x="728" y="428" width="360" height="70" rx="10"/><rect x="728" y="428" width="360" height="70" rx="10" fill="none" class="strong" stroke-width="1"/>
  <rect x="744" y="442" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="752" y="454" text-anchor="middle" font-size="11" font-weight="600">3</text>
  <path class="ic" d="M770 442 a6 6 0 1 0 0.1 0"/>
  <text class="dtype" x="786" y="454">CONCEPT</text>
  <text class="sec" x="850" y="454" font-size="12">reciprocal rank fusion</text>
  <text class="sec" x="744" y="478" font-size="12.5">Rank-based score fusion — robust,</text>
  <text class="sec" x="744" y="492" font-size="12.5" fill="#6a6a63">no per-query tuning.</text>
</svg>
