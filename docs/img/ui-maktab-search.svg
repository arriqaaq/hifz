    <path class="ic" d="M352 257 h7 l3 3 v7 h-10 z" stroke-width="1.3"/>
    <text class="dtype" x="370" y="264">EXTERNAL</text>
    <text class="title" x="436" y="264">enable_time</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.016</text>
    <line class="line" x1="352" y1="278" x2="834" y2="278"/>
  </g>
  <!-- row 4 -->
  <g transform="translate(0,120)">
    <text class="mono" x="352" y="264" fill="#6a6a63" font-size="11">&lt;&gt;</text>
    <text class="dtype" x="374" y="264">CODE_SYMBOL</text>
    <text class="title" x="462" y="264">REAL_CLOCK_GETTIME</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.016</text>
    <text class="snip" x="352" y="282">static REAL_CLOCK_GETTIME: OnceLock&lt;Option&lt;ClockGettimeFn&gt;&gt; = OnceLock::new();</text>
    <line class="line" x1="352" y1="296" x2="834" y2="296"/>
  </g>
  <!-- row 5 -->
  <g transform="translate(0,166)">
    <text class="mono" x="352" y="264" fill="#6a6a63" font-size="11">&lt;&gt;</text>
    <text class="dtype" x="374" y="264">CODE_SYMBOL</text>
    <text class="title" x="462" y="264">sim_elapsed</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.016</text>
    <text class="snip" x="352" y="282">pub fn sim_elapsed() -&gt; Option&lt;std::time::Duration&gt; {</text>
    <line class="line" x1="352" y1="296" x2="834" y2="296"/>
  </g>
  <!-- row 6 -->
  <g transform="translate(0,212)">
    <text class="mono" x="352" y="264" fill="#6a6a63" font-size="11">&lt;&gt;</text>
    <text class="dtype" x="374" y="264">CODE_SYMBOL</text>
    <text class="title" x="462" y="264">publish_sim_elapsed</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.016</text>
    <text class="snip" x="352" y="282">pub fn publish_sim_elapsed(_elapsed: std::time::Duration) {}</text>
    <line class="line" x1="352" y1="296" x2="834" y2="296"/>
  </g>
  <!-- row 7 (external) -->
  <g transform="translate(0,258)">
    <path class="ic" d="M352 257 h7 l3 3 v7 h-10 z" stroke-width="1.3"/>
    <text class="dtype" x="370" y="264">EXTERNAL</text>
    <text class="title" x="436" y="264">std::time::Duration</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.016</text>
  </g>

