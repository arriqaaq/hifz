  <path class="ic" d="M18 428 a6 6 0 1 0 2 -4 M18 422 v4 h4"/><path class="ic" d="M24 425 v4 l3 2"/>
  <ellipse class="ic" cx="24" cy="461" rx="6" ry="2.6"/><path class="ic" d="M18 461 v4 a6 2.6 0 0 0 12 0 v-4"/>
