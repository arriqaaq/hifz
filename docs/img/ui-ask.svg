  <circle cx="1024" cy="24" r="4" fill="#15803D"/><text class="muted mono" x="1034" y="28" font-size="12">v0.4.2</text>

  <!-- ===== MAIN ===== -->
  <!-- project picker (top right) -->
  <rect class="bg" x="940" y="62" width="148" height="26" rx="6"/><rect x="940" y="62" width="148" height="26" rx="6" fill="none" class="strong" stroke-width="1"/>
  <text class="sec" x="952" y="79" font-size="12">Project: hifz</text><path class="ic" d="M1070 73 l4 4 4 -4"/>

  <!-- ask bar (hard shadow) -->
  <rect class="ink" x="356" y="104" width="732" height="52" rx="10"/>
  <rect class="surf" x="352" y="100" width="732" height="52" rx="10"/>
  <rect x="352" y="100" width="732" height="52" rx="10" fill="none" class="strong" stroke-width="1"/>
  <text class="ink" x="372" y="131" font-size="16">How does hifz recall memories?</text>
  <circle cx="1058" cy="126" r="19" fill="#d9f400" stroke="#1a1a1a" stroke-width="1"/>
  <path class="ic-on" d="M1050 126 h14 M1058 120 l6 6 -6 6" stroke-width="2"/>

  <!-- modes -->
  <g font-size="11" font-weight="600">
    <rect x="352" y="166" width="50" height="24" rx="6" fill="#d9f400" stroke="#1a1a1a" stroke-width="1.5"/>
    <text class="ink" x="377" y="182" text-anchor="middle">Ask</text>
    <text class="muted" x="416" y="182">Search</text>
  </g>

  <!-- two-column layout -->
  <!-- LEFT: answer -->
  <g class="ans">
    <text x="352" y="226">hifz recalls with a <tspan font-weight="600">hybrid search</tspan>:</text>
    <text x="352" y="252">BM25 over an identifier-aware index,</text>
    <text x="352" y="278">plus an HNSW vector KNN, fused with</text>
    <text x="352" y="304">reciprocal rank fusion.</text>
    <text x="352" y="330">It then expands one hop over the typed</text>
    <text x="352" y="356">knowledge graph so linked memories</text>
    <text x="352" y="382">ride along, then ranks each hit by</text>
    <text x="352" y="408">strength × decay × access.</text>
  </g>
  <!-- inline cite chips at line ends -->
  <g font-size="11" font-weight="600">
    <rect x="524" y="292" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="532" y="304" text-anchor="middle">1</text>
    <rect x="612" y="344" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="620" y="356" text-anchor="middle">2</text>
    <rect x="548" y="396" width="16" height="15" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/><text class="ink" x="556" y="408" text-anchor="middle">3</text>
  </g>

