  <text class="mono" x="42" y="264" fill="#1a1a1a" font-size="13" font-weight="700">src/auth/jwt.rs</text>
  <rect x="170" y="252" width="48" height="18" rx="9" fill="rgba(180,83,9,0.10)"/><text class="mono" x="194" y="265" text-anchor="middle" fill="#B45309" font-size="9" letter-spacing="0.08em">RUST</text>
  <rect class="alt" x="226" y="252" width="76" height="18" rx="9"/><text class="mono" x="264" y="265" text-anchor="middle" fill="#6a6a63" font-size="10">L88–L104</text>
  <text class="faint mono" x="876" y="265" text-anchor="end" font-size="11">0.864</text>
  <rect class="alt" x="42" y="280" width="836" height="52"/>
