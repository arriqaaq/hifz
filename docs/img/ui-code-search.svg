  <rect x="186" y="370" width="48" height="18" rx="9" fill="rgba(180,83,9,0.10)"/><text class="mono" x="210" y="383" text-anchor="middle" fill="#B45309" font-size="9" letter-spacing="0.08em">RUST</text>
  <rect class="alt" x="242" y="370" width="84" height="18" rx="9"/><text class="mono" x="284" y="383" text-anchor="middle" fill="#6a6a63" font-size="10">L210–L228</text>
  <text class="faint mono" x="876" y="383" text-anchor="end" font-size="11">0.795</text>
  <rect class="alt" x="42" y="398" width="836" height="36"/>
  <rect x="42" y="398" width="836" height="36" fill="none" class="line"/>
  <g class="cd">
    <text x="56" y="420">    .<tspan class="fn">route</tspan>(<tspan class="str">"/auth/refresh"</tspan>, <tspan class="fn">post</tspan>(refresh_handler))</text>
  </g>

