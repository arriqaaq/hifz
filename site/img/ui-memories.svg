  <text class="faint mono" x="980" y="600" font-size="10">● 0.64</text>
  <text class="faint mono" x="1036" y="600" font-size="10">👁 3</text>
  <text class="faint" x="1068" y="601" font-size="15">+</text>
  <text class="muted" x="436" y="618" font-size="12" font-style="italic">Per-symbol doc comments are not indexed — don't rely on them for recall.</text>
