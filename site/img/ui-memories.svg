  <text class="faint mono" x="980" y="542" font-size="10">● 0.95</text>
  <text class="faint mono" x="1036" y="542" font-size="10">👁 9</text>
  <text class="faint" x="1068" y="543" font-size="15">+</text>
  <text class="muted" x="416" y="560" font-size="12" font-style="italic">commit_made only fired for agent-run commits; make install-git-hook fixes it.</text>

  <!-- Card 5: collapsed GOTCHA -->
  <rect class="surf" x="344" y="576" width="740" height="50" rx="10"/>
  <rect x="344" y="576" width="740" height="50" rx="10" fill="none" class="strong" stroke-width="1.5"/>
  <rect x="360" y="586" width="64" height="18" rx="9" fill="rgba(245,158,11,0.12)"/>
  <rect x="360" y="586" width="64" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="1"/>
