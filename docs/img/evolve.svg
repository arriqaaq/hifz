<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .head { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.4; }
      .head-cap { fill: #ffedd5; stroke: #f97316; stroke-width: 1.4; }
      .head-llm { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; }
      .head-db { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .head-text { font-size: 13px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lifeline { stroke: #d4d4d8; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .activation { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1; }
      .msg { stroke: #52525b; stroke-width: 1.4; fill: none; }
      .msg-async { stroke: #52525b; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
      .msg-return { stroke: #71717a; stroke-width: 1.2; fill: none; stroke-dasharray: 2 3; }
      .msg-text { font-size: 11px; fill: #18181b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .msg-text-sub { font-size: 10px; fill: #71717a; }
      .frame { fill: none; stroke: #a1a1aa; stroke-width: 1; }
      .frame-label { font-size: 10px; font-weight: 700; fill: #52525b; letter-spacing: 0.04em; }
      .frame-bg { fill: #fafafa; }
      .badge { fill: #ddd6fe; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #5b21b6; }
    </style>
    <marker id="msg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="msg-ar-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>

  <!-- Headers / lifelines -->
  <g>
    <rect class="head" x="40" y="20" width="140" height="36" rx="6"/>
    <text class="head-text" x="110" y="44" text-anchor="middle" fill="#5b21b6">Write path</text>
    <line class="lifeline" x1="110" y1="56" x2="110" y2="520"/>
  </g>
  <g>
    <rect class="head-cap" x="240" y="20" width="140" height="36" rx="6"/>
    <text class="head-text" x="310" y="44" text-anchor="middle" fill="#9a3412">Evolve queue</text>
    <line class="lifeline" x1="310" y1="56" x2="310" y2="520"/>
  </g>
  <g>
    <rect class="head-llm" x="440" y="20" width="140" height="36" rx="6"/>
    <text class="head-text" x="510" y="44" text-anchor="middle" fill="#92400e">LLM (Ollama)</text>
    <line class="lifeline" x1="510" y1="56" x2="510" y2="520"/>
  </g>
  <g>
    <rect class="head-db" x="640" y="20" width="160" height="36" rx="6"/>
    <text class="head-text" x="720" y="44" text-anchor="middle" fill="#166534">SurrealDB</text>
    <line class="lifeline" x1="720" y1="56" x2="720" y2="520"/>
  </g>

  <!-- Step 1: INSERT memory -->
  <path class="msg" d="M 110 84 L 720 84" marker-end="url(#msg-ar)"/>
  <text class="msg-text" x="120" y="78">1 · INSERT memory $new (deterministic)</text>

  <!-- Step 2: link.rs creates edges -->
  <path class="msg" d="M 110 116 L 720 116" marker-end="url(#msg-ar)"/>
  <text class="msg-text" x="120" y="110">2 · link.rs creates edge records</text>

  <!-- opt frame: HIFZ_LLM_EVOLVE -->
  <g>
    <rect class="frame-bg" x="80" y="140" width="700" height="370" rx="6" opacity="0.6"/>
    <rect class="frame" x="80" y="140" width="700" height="370" rx="6"/>
    <rect class="badge" x="86" y="146" width="68" height="18" rx="4"/>
    <text class="badge-text" x="120" y="159" text-anchor="middle">opt</text>
    <text class="frame-label" x="160" y="159">HIFZ_LLM_EVOLVE = true</text>

    <!-- Step 3: enqueue -->
    <path class="msg-async" d="M 110 188 L 310 188" marker-end="url(#msg-ar)"/>
    <text class="msg-text" x="120" y="182">3 · enqueue($new.id) — async</text>

    <!-- Step 4: SELECT new + neighbours -->
    <path class="msg" d="M 310 220 L 720 220" marker-end="url(#msg-ar)"/>
    <text class="msg-text" x="320" y="214">4 · SELECT $new + KNN neighbours + edges</text>

    <path class="msg-return" d="M 720 244 L 310 244" marker-end="url(#msg-ar-soft)"/>
    <text class="msg-text-sub" x="320" y="238">rows</text>

    <!-- Step 5: prompt LLM -->
    <path class="msg" d="M 310 280 L 510 280" marker-end="url(#msg-ar)"/>
    <text class="msg-text" x="320" y="274">5 · prompt(new, neighbours, edges)</text>

    <path class="msg-return" d="M 510 304 L 310 304" marker-end="url(#msg-ar-soft)"/>
    <text class="msg-text-sub" x="320" y="298">JSON · {new_note, neighbour_updates[≤5]}</text>

    <!-- loop frame: per neighbour update -->
    <g>
      <rect class="frame" x="290" y="324" width="490" height="120" rx="6"/>
      <rect class="badge" x="296" y="330" width="68" height="18" rx="4"/>
      <text class="badge-text" x="330" y="343" text-anchor="middle">loop</text>
      <text class="frame-label" x="370" y="343">for each neighbour_update</text>

      <path class="msg" d="M 310 376 L 720 376" marker-end="url(#msg-ar)"/>
      <text class="msg-text" x="320" y="370">6 · UPDATE neighbour SET keywords, tags, context</text>

      <path class="msg" d="M 310 400 L 720 400" marker-end="url(#msg-ar)"/>
      <text class="msg-text" x="320" y="394">7 · RELATE neighbour-&gt;edge-&gt;new UNIQUE  (via=semantic)</text>

      <path class="msg" d="M 310 426 L 720 426" marker-end="url(#msg-ar)"/>
      <text class="msg-text" x="320" y="420">8 · UPDATE older SET is_latest=false  (alt: supersedes)</text>
    </g>

    <!-- Step 9: write back $new metadata -->
    <path class="msg" d="M 310 478 L 720 478" marker-end="url(#msg-ar)"/>
    <text class="msg-text" x="320" y="472">9 · UPDATE $new SET keywords, tags, context</text>
  </g>
</svg>
