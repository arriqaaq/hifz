  <g class="cd">
    <text x="56" y="300"><tspan class="kw">fn</tspan> <tspan class="fn">verify_claims</tspan>(token: &amp;str) -&gt; Result&lt;Claims&gt; {</text>
    <text x="56" y="318">    <tspan class="cmt">// access tokens stay stateless &amp; short-lived</tspan></text>
  </g>

  <!-- hit 3 -->
  <rect class="ink" x="26" y="360" width="870" height="88" rx="10"/>
  <rect class="surf" x="24" y="358" width="870" height="88" rx="10"/>
