  <!-- Card 4: collapsed FIX -->
  <rect class="surf" x="344" y="518" width="740" height="50" rx="10"/>
  <rect x="344" y="518" width="740" height="50" rx="10" fill="none" class="strong" stroke-width="1.5"/>
  <rect x="360" y="528" width="44" height="18" rx="9" fill="rgba(34,197,94,0.12)"/>
  <rect x="360" y="528" width="44" height="18" rx="9" fill="none" stroke="#22c55e" stroke-width="1"/>
