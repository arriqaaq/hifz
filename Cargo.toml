[workspace]
members = [".", "crates/kernel", "crates/memdiff", "crates/atlas"]

# Shared deps that MUST share one resolution across the workspace.
# surrealdb is a git-rev pin (not on crates.io) — a rev mismatch between
# hifz and kernel produces incompatible duplicate types.
[workspace.dependencies]
surrealdb = { git = "https://github.com/surrealdb/surrealdb", rev = "876df15b11fabd36b43eeba923f53c4d5ffa59a6", features = ["kv-surrealkv", "kv-mem"] }

[package]
name = "hifz"
version = "0.1.0"
edition = "2024"
default-run = "hifz"

[dependencies]
kernel = { path = "crates/kernel", default-features = false }
memdiff = { path = "crates/memdiff" }
# atlas corpus-graph product, mounted under /api/v1/atlas behind the
# `atlas` feature. Optional → default build is byte-identical without it.
atlas = { path = "crates/atlas", optional = true }
# Web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
# Binary resolution
which = "7"

# Database — shared git-rev pin via [workspace.dependencies].
# To update: edit the rev in [workspace.dependencies] then `cargo update surrealdb`.
surrealdb = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Embeddings (local, free)
fastembed = "5"

# HTTP client (Ollama, optional)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Text processing
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Concurrent data structures
dashmap = "6"

# Streaming
futures = "0.3"

# URL encoding for MCP tool arg → REST query string
urlencoding = "2"

# Progress bars (for benchmark)
indicatif = "0.17"

# Code indexing (gated by `code` feature, default-on).
# tree-sitter grammar API drifts across minor versions — pin minors.
ignore                 = { version = "0.4",  optional = true }
text-splitter          = { version = "0.30", features = ["code"], optional = true }
tree-sitter            = { version = "0.26", optional = true }
streaming-iterator     = { version = "0.1",  optional = true }
tree-sitter-rust       = { version = "0.24", optional = true }
tree-sitter-python     = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go         = { version = "0.25", optional = true }
tree-sitter-java       = { version = "0.23", optional = true }
tree-sitter-c          = { version = "0.24", optional = true }
tree-sitter-cpp        = { version = "0.23", optional = true }
notify                 = { version = "8",    optional = true }
notify-debouncer-mini  = { version = "0.6",  optional = true }

[features]
default = ["code"]
# atlas: mount the corpus-graph product under /api/v1/atlas. Not in
# `default` → standard builds/daemon are unaffected.
atlas = ["dep:atlas", "code"]
code = [
    "kernel/code-parse",
    "dep:ignore",
    "dep:text-splitter",
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:notify",
    "dep:notify-debouncer-mini",
]

[[bin]]
name = "longmemeval-bench"
path = "benchmark/longmemeval_bench.rs"

[[bin]]
name = "memory-bench"
path = "benchmark/memory_bench.rs"

[[bin]]
name = "corpus-code-bench"
path = "benchmark/corpus_code_bench.rs"

[[bin]]
name = "corpus-memory-bench"
path = "benchmark/corpus_memory_bench.rs"

[[bin]]
name = "parity-bench"
path = "benchmark/parity_bench.rs"

[[bin]]
name = "code-retrieval-bench"
path = "benchmark/code_retrieval_bench.rs"
required-features = ["atlas"]

# For local dev: uncomment to use local SurrealDB checkout instead of git
# [patch.crates-io]
# surrealdb = { path = "/path/to/surrealdb/surrealdb" }

# Optimize dependencies in dev builds — SurrealDB's HNSW and query engine
# use deep call stacks that overflow when compiled at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
