  <text x="444" y="215" font-size="11">📄</text>
  <text class="ink" x="466" y="216" font-size="13" font-weight="700">JWT refresh tokens live in Redis, not the JWT itself</text>
  <text class="faint mono" x="980" y="216" font-size="10">● 0.92</text>
  <text class="faint mono" x="1036" y="216" font-size="10">👁 14</text>
  <text class="faint" x="1068" y="217" font-size="15">−</text>
  <!-- content pre -->
  <rect class="alt" x="360" y="232" width="708" height="84"/>
  <rect x="360" y="232" width="708" height="84" fill="none" class="line"/>
  <g font-size="12" fill="#3a3a36">
    <text x="372" y="252">Access tokens stay stateless and short-lived. The refresh token is keyed in Redis</text>
    <text x="372" y="270">(session:&lt;uid&gt;) so logout / rotation is a single DEL. Don't embed refresh state in</text>
    <text x="372" y="288">the JWT claims — it can't be revoked before expiry. See the session refresh flow in</text>
    <text class="mono" x="372" y="306" fill="#0E7490" font-size="11">src/auth/session.rs:42-71</text>
  </g>
