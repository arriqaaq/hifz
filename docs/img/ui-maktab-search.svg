  <line class="line" x1="48" y1="0" x2="48" y2="720"/>
  <rect class="ink" x="8" y="8" width="32" height="32" rx="6"/>
  <text x="24" y="31" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">h</text>
  <rect x="8" y="88" width="32" height="32" rx="6" fill="#d9f400"/>
  <rect class="ink" x="0" y="94" width="2" height="20" rx="1"/>
  <path class="ic" d="M17 69 L24 63 L31 69 M19 67 L19 75 L29 75 L29 67"/>
  <path class="ic-on" d="M17 99 h14 v8 h-8 l-4 4 v-4 h-2 z"/>
  <path class="ic" d="M24 134 l7 4 -7 4 -7 -4 z M17 142 l7 4 7 -4"/>
  <path class="ic" d="M18 171 h6 v6 h-6 z M24 174 h5 M29 168 h5 v6 h-5 z M29 180 h5 v6 h-5 z M24 177 v6 h5"/>
  <path class="ic" d="M17 212 h4 l3 -7 4 14 3 -7 h3"/>
  <circle class="ic" cx="24" cy="248" r="6"/><path class="ic" d="M24 242 v12 M21 245 q3 3 0 6 M27 245 q-3 3 0 6"/>
  <!-- Code glyph -->
  <path class="ic" d="M20 278 l-4 6 4 6 M28 278 l4 6 -4 6"/>
  <circle class="ic" cx="18" cy="318" r="2.5"/><circle class="ic" cx="31" cy="314" r="2.5"/><circle class="ic" cx="28" cy="326" r="2.5"/><path class="ic" d="M20 317 L29 315 M20 320 L27 325"/>
  <path class="ic" d="M24 349 l7 4 v8 l-7 4 -7 -4 v-8 z M24 349 v8 M24 357 l7 -4 M24 357 l-7 -4"/>
