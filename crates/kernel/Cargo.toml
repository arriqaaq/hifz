[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
# Database — shared git-rev pin via workspace (mismatch = type incompat)
surrealdb = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Embeddings (local, free)
fastembed = "5"

# HTTP client (Ollama)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Text processing
regex = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Code parsing (always compiled in). Pin minors — grammar
# API drifts across versions.
ignore                 = "0.4"
tree-sitter            = "0.26"
tree-sitter-rust       = "0.24"
tree-sitter-python     = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go         = "0.25"
tree-sitter-java       = "0.23"
tree-sitter-c          = "0.24"
tree-sitter-cpp        = "0.23"
