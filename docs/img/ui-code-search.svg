<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg     { fill: #f2f1eb; }
      .surf   { fill: #f8f8f5; }
