  <g class="cd">
    <text x="56" y="162"><tspan class="kw">pub fn</tspan> <tspan class="fn">refresh</tspan>(&amp;self, tok: &amp;RefreshToken) -&gt; Result&lt;Session&gt; {</text>
    <text x="56" y="180">    <tspan class="kw">let</tspan> key = <tspan class="fn">format!</tspan>(<tspan class="str">"session:{}"</tspan>, tok.subject);</text>
    <text x="56" y="198">    <tspan class="kw">let</tspan> raw = self.redis.<tspan class="fn">get</tspan>(&amp;key).<tspan class="kw">await</tspan>?;  <tspan class="cmt">// refresh state lives here</tspan></text>
  </g>

