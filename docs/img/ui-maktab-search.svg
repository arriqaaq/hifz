    <text class="snip" x="352" y="282">fn release_before_original_delivery_keeps_original_due_time() {</text>
    <line class="line" x1="352" y1="296" x2="834" y2="296"/>
  </g>
  <!-- row 2 -->
  <g transform="translate(0,46)">
    <text class="mono" x="352" y="264" fill="#6a6a63" font-size="11">&lt;&gt;</text>
    <text class="dtype" x="374" y="264">CODE_SYMBOL</text>
    <text class="title" x="462" y="264">clock_hook_uses_sim_time_inside_dst_context</text>
    <text class="faint mono" x="834" y="264" text-anchor="end" font-size="11">0.045</text>
    <text class="snip" x="352" y="282">fn clock_hook_uses_sim_time_inside_dst_context() {</text>
    <line class="line" x1="352" y1="296" x2="834" y2="296"/>
  </g>
