<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg     { fill: #f2f1eb; }
      .surf   { fill: #f8f8f5; }
      .alt    { fill: #ecebe4; }
      .ink    { fill: #1a1a1a; }
      .muted  { fill: #6a6a63; }
      .faint  { fill: #9a9a91; }
      .sec    { fill: #3a3a36; }
      .line   { stroke: #dedcd2; stroke-width: 1; }
      .strong { stroke: #1a1a1a; }
      .mono   { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .ic     { fill: none; stroke: #6a6a63; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ic-on  { fill: none; stroke: #1a1a1a; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .lbl    { font-size: 13px; fill: #3a3a36; }
      .h11    { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .dtype  { font-size: 10px; fill: #6a6a63; letter-spacing: 0.04em; }
      .title  { font-size: 11.5px; font-weight: 600; fill: #2563EB; }
      .snip   { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; fill: #3a3a36; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="720"/>

