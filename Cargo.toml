[workspace]
members = [".", "crates/kernel", "crates/memdiff", "crates/maktab"]

# Shared deps that MUST share one resolution across the workspace.
# surrealdb is a git-rev pin (not on crates.io) — a rev mismatch between
# hifz and kernel produces incompatible duplicate types.
[workspace.dependencies]
surrealdb = { git = "https://github.com/surrealdb/surrealdb", rev = "876df15b11fabd36b43eeba923f53c4d5ffa59a6", features = ["kv-surrealkv", "kv-mem"] }

[package]
name = "hifz"
version = "0.1.0"
edition = "2024"
default-run = "hifz"

[dependencies]
kernel = { path = "crates/kernel" }
memdiff = { path = "crates/memdiff" }
# maktab corpus-graph product, mounted under /api/v1/maktab behind the
# `maktab` feature. Optional → default build is byte-identical without it.
maktab = { path = "crates/maktab", optional = true }
# Web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
# Binary resolution
which = "7"

# Database — shared git-rev pin via [workspace.dependencies].
# To update: edit the rev in [workspace.dependencies] then `cargo update surrealdb`.
surrealdb = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Embeddings (local, free)
fastembed = "5"

# HTTP client (Ollama, optional)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Text processing
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Concurrent data structures
dashmap = "6"

# Streaming
futures = "0.3"

# URL encoding for MCP tool arg → REST query string
urlencoding = "2"

# Progress bars (for benchmark)
indicatif = "0.17"

# Code indexing (always compiled in).
# tree-sitter grammar API drifts across minor versions — pin minors.
ignore                 = "0.4"
text-splitter          = { version = "0.30", features = ["code"] }
tree-sitter            = "0.26"
streaming-iterator     = "0.1"
tree-sitter-rust       = "0.24"
tree-sitter-python     = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go         = "0.25"
tree-sitter-java       = "0.23"
tree-sitter-c          = "0.24"
tree-sitter-cpp        = "0.23"
notify                 = "8"
notify-debouncer-mini  = "0.6"

[features]
# maktab: mount the corpus-graph product under /api/v1/maktab. Not in
# `default` → standard builds/daemon are unaffected.
maktab = ["dep:maktab"]

# For local dev: uncomment to use local SurrealDB checkout instead of git
# [patch.crates-io]
# surrealdb = { path = "/path/to/surrealdb/surrealdb" }

# Optimize dependencies in dev builds — SurrealDB's HNSW and query engine
# use deep call stacks that overflow when compiled at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
