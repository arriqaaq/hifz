  <circle class="ic" cx="18" cy="282" r="2.5"/><circle class="ic" cx="31" cy="278" r="2.5"/><circle class="ic" cx="28" cy="290" r="2.5"/><path class="ic" d="M20 281 L29 279 M20 284 L27 289"/>
