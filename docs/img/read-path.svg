<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .q { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.6; }
      .q-name { font-size: 13px; font-weight: 700; fill: #5b21b6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .stage { fill: #ffffff; stroke: #52525b; stroke-width: 1.4; }
      .stage-opt { fill: #ffffff; stroke: #71717a; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .stage-name { font-size: 13px; font-weight: 600; fill: #18181b; }
      .stage-sub { font-size: 10px; fill: #71717a; }
      .merge { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .merge-name { font-size: 13px; font-weight: 700; fill: #166534; }
      .out { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.4; }
      .out-name { font-size: 13px; font-weight: 700; fill: #92400e; }
      .arrow { stroke: #52525b; stroke-width: 1.4; fill: none; }
      .arrow-opt { stroke: #71717a; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
      .formula { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5b21b6; }
      .branch-label { font-size: 11px; font-weight: 600; fill: #52525b; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="ar-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>

  <!-- Query -->
  <g>
    <rect class="q" x="20" y="100" width="100" height="50" rx="8"/>
    <text class="q-name" x="70" y="130" text-anchor="middle">query</text>
  </g>

  <!-- Two retrieval branches -->
  <g>
    <rect class="stage" x="170" y="40" width="170" height="60" rx="8"/>
    <text class="stage-name" x="255" y="66" text-anchor="middle">BM25</text>
    <text class="stage-sub" x="255" y="82" text-anchor="middle">title · content · narrative</text>
  </g>
  <g>
    <rect class="stage" x="170" y="150" width="170" height="60" rx="8"/>
    <text class="stage-name" x="255" y="176" text-anchor="middle">HNSW vector</text>
    <text class="stage-sub" x="255" y="192" text-anchor="middle">cosine · 384d embedding</text>
  </g>

  <!-- RRF fusion -->
  <g>
    <rect class="merge" x="380" y="100" width="120" height="50" rx="8"/>
    <text class="merge-name" x="440" y="124" text-anchor="middle">RRF fusion</text>
    <text class="stage-sub" x="440" y="138" text-anchor="middle">k = 10</text>
  </g>

  <!-- Graph expansion -->
  <g>
    <rect class="stage" x="535" y="100" width="120" height="50" rx="8"/>
    <text class="stage-name" x="595" y="120" text-anchor="middle">graph expand</text>
    <text class="stage-sub" x="595" y="136" text-anchor="middle">1-hop neighbours</text>
  </g>

  <!-- Rerank (optional) -->
  <g>
    <rect class="stage-opt" x="535" y="180" width="120" height="50" rx="8"/>
    <text class="stage-name" x="595" y="200" text-anchor="middle" fill="#52525b">rerank</text>
    <text class="stage-sub" x="595" y="216" text-anchor="middle">LLM / cross-encoder</text>
  </g>

  <!-- Rank -->
  <g>
    <rect class="stage" x="690" y="80" width="160" height="90" rx="8"/>
    <text class="stage-name" x="770" y="104" text-anchor="middle">rank</text>
    <text class="stage-sub" x="770" y="120" text-anchor="middle">recency · access · strength</text>
    <text class="formula" x="770" y="142" text-anchor="middle">strength × exp(-age/30)</text>
    <text class="formula" x="770" y="158" text-anchor="middle">× (1 + 0.1·access)</text>
  </g>

  <!-- Output -->
  <g>
    <rect class="out" x="540" y="248" width="310" height="22" rx="11"/>
    <text class="out-name" x="695" y="264" text-anchor="middle">results · core memory · injected context</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M 120 120 C 145 120, 145 70, 170 70" marker-end="url(#ar)"/>
  <path class="arrow" d="M 120 130 C 145 130, 145 180, 170 180" marker-end="url(#ar)"/>

  <path class="arrow" d="M 340 70 C 360 70, 370 110, 380 122" marker-end="url(#ar)"/>
  <path class="arrow" d="M 340 180 C 360 180, 370 140, 380 128" marker-end="url(#ar)"/>

  <path class="arrow" d="M 500 125 L 535 125" marker-end="url(#ar)"/>
  <path class="arrow-opt" d="M 595 150 L 595 180" marker-end="url(#ar-opt)"/>

  <path class="arrow" d="M 655 120 L 690 120" marker-end="url(#ar)"/>
  <path class="arrow-opt" d="M 655 205 C 680 205, 700 175, 710 170" marker-end="url(#ar-opt)"/>

  <path class="arrow" d="M 770 170 L 770 248" marker-end="url(#ar)"/>

  <text class="branch-label" x="540" y="172">neighbour score = seed × 0.5 × edge.score</text>
</svg>
